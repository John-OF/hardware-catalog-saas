# Integracion continua (TEC-2)
#
# Antes no habia nada que corriera los tests salvo la buena voluntad de quien
# tocaba el codigo. Los guards de la Fase 6 (aislamiento entre tiendas, panel
# cerrado a clientes) solo valen si alguien los ejecuta en cada cambio.
#
# Los tests usan SQLite en memoria (ver phpunit.xml), asi que el job de API no
# necesita levantar MySQL.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saas-hardware-api

    steps:
      - uses: actions/checkout@v4

      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # sqlite3/pdo_sqlite para los tests; intl no hace falta (App\Support\Money
          # formatea a mano justo para no depender de ella).
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip, bcmath
          coverage: none

      - name: Cachear dependencias de Composer
        uses: actions/cache@v4
        with:
          path: saas-hardware-api/vendor
          key: composer-${{ hashFiles('saas-hardware-api/composer.lock') }}

      # TEC-18: el .env va ANTES de composer install. La instalacion termina con
      # `php artisan package:discover`, que arranca la aplicacion; sin .env,
      # APP_ENV cae a `production` y la guarda de imagenes de TEC-10 se niega a
      # arrancar sin R2. Con el .env detras, este job se cayo en "Instalar
      # dependencias" del 2026-09-06 al 2026-09-27 y ningun test de la API llego
      # a correr aqui, sin que nadie lo viera.
      - name: Crear .env
        run: cp .env.example .env

      - name: Instalar dependencias
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generar APP_KEY
        run: php artisan key:generate

      - name: Tests
        run: php artisan test

  frontend:
    name: Frontend (typecheck + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: saas-hardware-frontend

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: saas-hardware-frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # INF-5: Vitest + Testing Library en jsdom. Carrito, checkout, variantes,
      # mensajes de error de los formularios y guardas de sesion: lo que mas
      # duele romper y hasta ahora solo se probaba a mano.
      - name: Tests
        run: npm test

      # El build tambien typechequea (`tsc -b`), pero ademas detecta imports rotos
      # y assets que faltan, que tsc solo no ve.
      - name: Build
        run: npm run build

      # ATENCION: lint NO bloquea todavia. El repo arrastra ~80 errores previos,
      # casi todos `no-explicit-any` en bloques catch. Dejarlo bloqueante hoy
      # significaria un CI rojo permanente, que es peor que no tenerlo. El paso
      # queda visible para poder ir bajando la cuenta; cuando llegue a cero, se
      # quita el continue-on-error.
      - name: Lint (informativo, no bloquea)
        run: npm run lint
        continue-on-error: true

      # AUD-14: esta regla concreta SI bloquea, y va aparte por eso.
      #
      # Un hook detras de un return temprano no es un aviso de estilo como los
      # `no-explicit-any` de arriba: el dia que el componente se re-renderiza por
      # el otro camino, React se encuentra con menos hooks de los que registro y
      # tumba la pantalla entera. Estaba en `CatalogPage`, se arreglo, y hoy la
      # cuenta es cero en todo `src`; este paso es lo que impide que vuelva sin
      # que nadie se entere, sin tener que esperar a que bajen los otros 74.
      #
      # TEC-22: ESLint sale con 1 si encuentra algo (hoy siempre, por los de
      # arriba) y con 2 si no pudo revisar nada (configuracion rota, un plugin que
      # no carga tras actualizar). Con un `|| true` a secas, el 2 dejaba el json
      # vacio y el paso decia "sin violaciones" sin haber mirado un archivo.
      - name: Lint - regla de hooks (bloqueante)
        run: |
          estado=0
          npx eslint src -f json > /tmp/eslint.json || estado=$?
          if [ "$estado" -gt 1 ]; then
            echo "::error::ESLint no pudo ejecutarse (codigo $estado): la regla de hooks no se ha comprobado"
            npx eslint src || true
            exit 1
          fi
          if grep -q '"ruleId":"react-hooks/rules-of-hooks"' /tmp/eslint.json; then
            echo "::error::Hay hooks detras de un return temprano (react-hooks/rules-of-hooks)"
            npx eslint src | grep -B 6 'rules-of-hooks' || true
            exit 1
          fi
          echo "Sin violaciones de react-hooks/rules-of-hooks"

      # UI-5: mismo criterio que el paso de arriba, otra regla que si bloquea.
      #
      # El CSS de pagina va acotado con `:where(.page-x)`, que no suma
      # especificidad. Si una de esas reglas apunta a una clase de un componente
      # -CSS global, sin acotar- las dos valen (0,1,0) y el empate lo decide el
      # orden de carga de los chunks, o sea por que ruta entro el usuario: la
      # misma regla sale bien en una pantalla y mal en otra, y el navegador no
      # avisa de nada. Paso justo con el pie de tienda.
      #
      # No es un aviso de estilo: es un fallo que solo se reproduce navegando en
      # cierto orden, asi que encontrarlo a mano cuesta una tarde. Hoy la cuenta
      # es cero y este paso es lo que impide que vuelva.
      - name: CSS - empates pagina/componente (bloqueante)
        run: npm run check:css

  # AUD-1: hasta ahora nada vigilaba los avisos de seguridad de las dependencias,
  # y se acumularon 17 en Composer (guzzle, psr7, commonmark) y 7 en npm
  # (react-router, postcss, nanoid, form-data...) sin que nadie se enterara.
  #
  # Va en un job aparte a proposito. Un aviso nuevo se publica rio arriba, sin
  # que nadie de aqui toque nada: si el paso viviera dentro de los jobs de API o
  # frontend, ese dia el CI se pondria rojo y ademas cortaria los tests y el
  # build, que es justo la informacion que hace falta para decidir si el
  # actualizarse rompe algo. Asi cada cosa da su resultado por separado.
  #
  # Los dos audits leen solo los ficheros de lock, asi que no hace falta instalar
  # dependencias: ni `composer install` ni `npm ci`.
  seguridad:
    name: Auditoria de dependencias
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: composer audit
        working-directory: saas-hardware-api
        run: composer audit --locked

      # TEC-22: los dos audits de npm corren aunque falle `composer audit`. En
      # TEC-22 el fallo de Composer corto el paso de npm, y sus 19 avisos solo se
      # vieron en local.
      #
      # Lo que llega al navegador (dependencies), sin umbral: cualquier aviso nuevo,
      # de la severidad que sea, pone esto en rojo.
      - name: npm audit (produccion, sin umbral)
        if: ${{ !cancelled() }}
        working-directory: saas-hardware-frontend
        run: npm audit --omit=dev

      # Las herramientas de desarrollo (devDependencies), desde alto. Bajo este
      # umbral queda, a sabiendas, la cadena de eslint y typescript-eslint por
      # `minimatch` (GHSA-g3hv-75wg-m249, medio): solo esta arreglado en la 11, que
      # eslint 10 aun no admite, y `npm audit fix --force` "lo arregla" bajando
      # typescript-eslint a la 8.14 y @eslint/js a la 9. Es una denegacion de
      # servicio al expandir globs, en el lint, con nuestra propia configuracion,
      # y no llega al build. Cuando eslint admita minimatch 11, `npm audit fix`
      # lo cierra y este umbral vuelve a quitarse.
      - name: npm audit (desarrollo, desde alto)
        if: ${{ !cancelled() }}
        working-directory: saas-hardware-frontend
        run: npm audit --audit-level=high
